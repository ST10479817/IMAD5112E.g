name: Kotlin Build

on:
  push:
    branches:
      - main  # This triggers the workflow when changes are pushed to the main branch
  # This triggers the workflow when a pull request is made to the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu environment

    steps:
      # Step 1: Check out the repository's code
      - name: Checkout code
        uses: actions/checkout@v2  # This checks out your repository code

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'  # Ensure that Java 17 is set up for your Android project

      #  gradlew executable (important for Unix-based systems)

      # Step 5: Build the project using Gradle
      - name: Build the project
        run: ./gradlew build  # Runs the Gradle build command

      # Step 6: Run unit tests
      - name: Run unit tests
        run: ./gradlew test  # This runs the unit tests in your Android project


      working-dirction: IMAD5112E.g
